# Reference: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

[project]
name = "mongo-diff"
version = "0.3.2"
description = "Compare MongoDB collections from the command line."
readme = "README.md"
requires-python = ">= 3.10, < 4.0"
keywords = ["mongodb", "mongo", "diff", "compare", "collection", "database", "data"]
dependencies = [
    # We use `typer` as a CLI framework.
    # Docs: https://typer.tiangolo.com/
    "typer >= 0.9.0, < 0.19.0",
    # We use `rich` to format console output.
    # Docs: https://rich.readthedocs.io/en/stable/index.html
    "rich >= 13.7.0, < 14.0.0",
    # We use `dictdiffer` to compare Python dictionaries.
    # Docs: https://dictdiffer.readthedocs.io/en/latest/
    "dictdiffer >= 0.9.0, < 0.10.0",
    # We use `pymongo` to communicate with MongoDB servers.
    # Docs: https://pymongo.readthedocs.io/en/stable/
    "pymongo >= 4.6.1, < 5.0.0",
]

[project.urls]
Homepage = "https://github.com/eecavanna/mongo-diff"
Documentation = "https://github.com/eecavanna/mongo-diff"
Repository = "https://github.com/eecavanna/mongo-diff"

[project.scripts]
# Reference: https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#creating-executable-scripts
mongo-diff = "mongo_diff.mongo_diff:app"

[dependency-groups]
dev = [
    # We use `black` to format source code.
    # Docs: https://black.readthedocs.io/en/stable/
    "black >= 24.1.1, < 27.0.0",
    # We use `pytest` to run automated tests (including doctests).
    # Docs: https://docs.pytest.org/en/stable/
    "pytest >= 9.2.0, < 10.0.0",
]

[tool.pytest.ini_options]
# Configure `pytest` to run regular tests and doctests.
# Reference: https://docs.pytest.org/en/stable/reference/customize.html#pyproject-toml
addopts = ["--doctest-modules"]
testpaths = ["mongo_diff", "tests"]

[build-system]
requires = ["uv_build >= 0.12.4, < 0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
